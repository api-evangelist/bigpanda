notes:
  - >-
    Addressing is environment-scoped, not globally id-addressed. An agent that holds an incident_id
    still cannot act on it without knowing which environment it belongs to — 11 of the 13 incident-level
    paths require both ids.
  - >-
    Ordering is a first-class resource. Enrichment items, alert tags and correlation patterns each expose
    a separate order endpoint (Update Enrichment Items Order, Update tag order, Update Correlation
    Pattern Order, Reset Correlation Patterns Order), because evaluation order changes behaviour.
  - >-
    87 schema objects across 4 specs carry BigPanda's own placeholder text — "Schema pending: definition
    lives in unbundled source-repo files. Replace once the bundled spec is provided." — chiefly on the
    SCIM and configuration surfaces. Those entities are real and their paths are documented, but their
    field-level shape is not published, so no relationship was inferred from them.
