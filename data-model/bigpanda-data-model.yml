description: >-
  The BigPanda entity graph as the API expresses it. The spine is Environment -> Incident -> Alert:
  an environment is a saved BPQL query that scopes a set of incidents, an incident is a correlated
  cluster of alerts, and almost every incident operation is addressed through its environment
  (/resources/v2.0/environments/{environment_id}/incidents/{incident_id}/...). Changes hang off
  incidents through Root Cause Changes. Everything else — enrichment, filters, correlation patterns,
  maintenance plans, topology — is configuration that shapes how alerts become incidents.
