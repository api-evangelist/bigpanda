cross_cutting_rules_every_skill_repeats:
  - No idempotency key exists anywhere in the BigPanda API; a retried POST is a second write.
  - Rate limits are per endpoint (5/sec default, 2/sec per SCIM route, 1/sec for batch alert resolve, 400/min for changes, 100/min for Biggy) and no rate-limit response header is documented.
  - Errors are conventional HTTP status codes with a {"status", "errors"[]} JSON body; 403 means the role lacks a permission, not that the key is bad.
  - An organization lives in exactly one region and must use that region's base URL.
  - Incidents are addressed through their environment, so an incident_id alone is not enough to act.
