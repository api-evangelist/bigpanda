    highlights:
      - Biggy Agent available directly inside the AI Detection and Response console and the Incident Feed (requires both ADR and AI Incident Assistant).
      - ServiceNow store app 3.1 — block-resolve-on-tags, expanded transform rules engine (boolean tag expressions, presence matching, not-equals), governed CMDB auto-create, CMDB dot-walk enrichment, Affected CIs on incidents, email-based assignment. All new options default off.
      - Improved Jira Service Management integration — field mapping, status mapping and sync, bidirectional resolve, Jira issue URL posted back, summary/description templates, correlated alerts table.
      - Health Dashboard environment filters.
