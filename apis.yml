position: Consuming
description: 'BigPanda is an agentic IT operations (AIOps) platform that ingests alerts from monitoring and observability
  tools, correlates them into a small number of actionable incidents, links those incidents to the deployment and
  configuration changes that caused them, and increasingly acts on them through AI agents. Its public API is large
  and current: 263 operations across 165 paths, published as OpenAPI 3.0.1 on BigPanda''s own API reference, covering
  alert ingestion and enrichment, correlation patterns, incidents, environments, changes and root cause, maintenance
  plans, topology, outbound webhooks, SCIM 2.0 user provisioning, SSO, roles and API keys, plus a Biggy assistant
  surface with a remote Model Context Protocol server and an A2A agent endpoint.'
