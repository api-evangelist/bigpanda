method: probed
source: live probes of every host this record knows — registrable domain + www, each API baseURL host,
  every OpenAPI servers[] host, the docs host, the API-reference host, the Biggy agent host, the status
  host and the trust host.
description: >-
  Well-known discovery documents served by BigPanda. Two real documents were found, both on the
  WordPress marketing site (www.bigpanda.io): an RFC 8414 OAuth authorization-server metadata document
  and an RFC 9728 OAuth protected-resource document, which together advertise a WordPress MCP server at
  https://www.bigpanda.io/wp-json/mcp/mcp-oauth-server with the scope "mcp". No security.txt is served
  on any BigPanda-operated host. The 200s on docs.bigpanda.io and trust.bigpanda.io are SPA catch-all
  shells (an identical HTML body is returned for every /.well-known/ path) and are recorded as misses.
  The security.txt on status.bigpanda.io is Atlassian Statuspage's own vendor document (Contact
  atlassian.com, Canonical https://www.atlassian.com/.well-known/security.txt), not BigPanda's, so no
  SecurityTxt pointer is claimed for BigPanda from it.
hosts:
  - host: bigpanda.io
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/oauth-authorization-server
        status: 200
        file: well-known/bigpanda-oauth-authorization-server.json
        content_type: application/json
        note: RFC 8414 authorization server metadata. issuer https://www.bigpanda.io, PKCE S256, scopes_supported [mcp].
      - path: /.well-known/oauth-protected-resource
        status: 200
        file: well-known/bigpanda-oauth-protected-resource.json
        content_type: application/json
        note: RFC 9728 protected resource metadata naming https://www.bigpanda.io/wp-json/mcp/mcp-oauth-server.
