  https://api-docs.bigpanda.io/using-bigpanda-apis (BigPanda's own statement), plus registry metadata
  from rubygems.org/api/v1, pypi.org/pypi/<pkg>/json, registry.npmjs.org and api.github.com/orgs/bigpandaio.
description: >-
  BigPanda states plainly in its current API reference that it does not ship client libraries: "You can
  call BigPanda APIs directly over HTTPS with any HTTP client, with the BigPanda Postman collection, or
  through an MCP-compatible AI client. BigPanda does not publish language SDKs." Two first-party client
  gems/packages DO still exist on public registries under the BigPanda name, but both are long
  abandoned — the Ruby client's last release is 2014 and the Python module's is 2017, a decade and
  more behind the 263-operation API surface they claim to wrap. Everything else BigPanda ships on
  package registries or GitHub is integration tooling (Jenkins, Ansible, Splunk, Terraform), not an
  API client.
