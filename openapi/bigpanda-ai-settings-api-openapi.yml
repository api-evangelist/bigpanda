  /resources/v2.0/environments/{environment_id}/incidents/{incident_id}/ai/analysis:
    post:
      summary: Generate an AI Analysis
      deprecated: false
      description: 'Generate or regenerate an AI analysis for a specific incident.


        ## Authentication

        All BigPanda APIs require Bearer Token Authorization in the call headers.

        This API uses the User API Key type of Authorization token. Your User API Key must be provided in the header, prefixed
        by the word `Bearer`.


        Example:

        `Authorization: Bearer [YOUR_USER_API_KEY]`


        **Rate limit:** 5 requests per second.'
      operationId: generate-an-ai-analysis
      tags:
