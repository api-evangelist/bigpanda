components:
  securitySchemes:
    BearerUser131:
      type: http
      scheme: bearer
      description: 'Format: "Bearer {User API Key}" BigPanda recommends adding

        [Authentication](https://docs.bigpanda.io/reference/introduction#authentication-and-headers) headers only in the secure
        tool you use to make API calls

        '
  schemas:
    aia_config_object:
      required:
      - name
      - enabled
      - environments
      - alertTags
      - isAutoTriggerEnabled
      - promptAddendum
      type: object
      description: Schema for the AIA config object.
      properties:
        name:
          type: string
          description: The name of the AI Analysis configuration.
          examples:
          - Test configuration
        enabled:
          type: boolean
          description: Whether the configuration is enabled or disabled.
          examples:
          - true
        environments:
          type: array
          description: The environment(s) that the AI analysis configuration applies to.
          items:
            type: string
            examples:
            - 63bd568809cb331300f55555
        alertTags:
          type: array
          description: The alert tag(s) used to generate the AI analysis.
          items:
            type: string
            examples:
            - node, host
        isAutoTriggerEnabled:
          type: boolean
          description: Whether or not the analysis is enabled to auto-generate in the environments.
          examples:
          - true
        promptAddendum:
          type: string
          description: Instructions that the LLM will use when generating the analysis.
          examples:
          - Write the summary as if you were a pirate.
      x-apidog-orders:
      - name
      - enabled
      - environments
      - alertTags
      - isAutoTriggerEnabled
      - promptAddendum
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    generic200response:
      type: object
      description: 'Call was successful.

        '
      properties:
        status:
          type: integer
          examples:
          - 200
        data:
          type: object
          properties: {}
          x-apidog-orders: []
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - status
      - data
      x-apidog-folder: ''
      examples:
      - status: 200
        data: {}
      x-apidog-ignore-properties: []
    generic400response:
      type: object
      description: 'Call is missing parameters or malformed.

        '
      properties:
        status:
          type: integer
          examples:
          - 400
        errors:
          type: array
          items:
            type: string
            examples:
            - Call is missing parameters or malformed.
      x-apidog-orders:
      - status
      - errors
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    generic404response:
      type: object
      description: 'Requested endpoint or resource is not found.

        '
      properties:
        status:
          type: integer
          examples:
          - 404
        errors:
          type: array
          items:
            type: string
            examples:
            - Requested endpoint or resource is not found.
      x-apidog-orders:
      - status
      - errors
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    aia_retrieve_200:
      type: object
      properties:
        id:
          type: string
          examples:
          - 67f3dd71886657bfa1394444
        name:
          type: string
          examples:
          - Sample config
        enabled:
          type: boolean
          examples:
          - true
        environments:
          type: array
          items:
            type: string
            examples:
            - 60a2931648bd70995fd77777
        promptAddendum:
          type: string
          examples:
          - Write the summary as if you were a pirate.
        alertTags:
          type: array
          items:
            type: string
            examples:
            - host
        selectedRecommendationTags:
          type: array
          items:
            type: string
            examples:
            - Assignment_group
        recommendationScoreThreshold:
          type: integer
          examples:
          - 4
        updatedAt:
          type: integer
          examples:
          - 1741966296222
        updatedBy:
          type: string
          examples:
          - 65eb795b7b46b76b1b01f777
        isDefault:
          type: boolean
          examples:
          - true
        isAutoTriggerEnabled:
          type: boolean
          examples:
          - true
      x-apidog-orders:
      - id
      - name
      - enabled
      - environments
      - promptAddendum
      - alertTags
      - selectedRecommendationTags
      - recommendationScoreThreshold
      - updatedAt
      - updatedBy
      - isDefault
      - isAutoTriggerEnabled
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
x-server-notes:
- US host https://api.bigpanda.io verified live 2026-09-04 (HTTP 401 Authorization Required on an unauthenticated request).
- EU host https://api.eu.bigpanda.io is the value BigPanda publishes at https://api-docs.bigpanda.io/regions. It did NOT resolve
  in DNS on 2026-09-04. The live EU host observed on that date is https://eu-api.bigpanda.io (401 Authorization Required).
  The per-endpoint fragments on the same site declare a third EU value, https://eu-api.biggy.io, which also does not resolve.
  Recorded as published; not corrected.
