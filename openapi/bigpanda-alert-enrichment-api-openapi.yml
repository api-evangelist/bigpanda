components:
  securitySchemes:
    BearerUser13:
      type: http
      scheme: bearer
      description: 'Format: "Bearer {User API Key}" BigPanda recommends adding

        [Authentication](https://docs.bigpanda.io/reference/introduction#authentication-and-headers) headers only in the secure
        tool you use to make API calls

        '
    BearerUser131:
      type: http
      scheme: bearer
      description: 'Format: "Bearer {User API Key}" BigPanda recommends adding

        [Authentication](https://docs.bigpanda.io/reference/introduction#authentication-and-headers) headers only in the secure
        tool you use to make API calls

        '
  schemas:
    enrichment_item:
      type: object
      description: Schema for an enrichment item.
      properties:
        type:
          type: string
          description: 'Type of enrichment item. One of: `composition`, `extraction`,  `mapping`

            '
        active:
          type: boolean
          description: Whether enrichment is active.
        when:
          $ref: '#/components/schemas/when'
        config:
          oneOf:
          - $ref: '#/components/schemas/enrichment_config_composition'
          - $ref: '#/components/schemas/enrichment_config_extraction'
          - $ref: '#/components/schemas/enrichment_config_mapping'
        note:
          type: string
          description: Optional notes about the enrichment.
          nullable: true
      x-apidog-orders:
      - type
      - active
      - when
      - config
      - note
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    enrichment_config_mapping:
      type: object
      description: Schema for a  mapping enrichment rule.
      properties:
        name:
          type: string
          description: ''
        fields:
          type: array
          items:
            $ref: '#/components/schemas/enrichment_field'
      x-apidog-orders:
      - name
      - fields
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    enrichment_field:
      type: object
      description: Definition for an individual enrichment field.
      properties:
        title:
          type: string
          description: Column name on the mapping table.
          examples:
          - application
        type:
          type: string
          description: Whether the column is a `query_tag` or `result_tag`.
          examples:
          - query_tag
        tag_name:
          type: string
          description: (Optional) The name of the tag in BigPanda.
          examples:
          - very_cool
        override_existing:
          type: boolean
          description: (Optional) If a value has been populated for this tag by another map or enrichment rule, whether this
            value should replace that value
          examples:
          - false
        optional:
          type: boolean
          description: (Optional) Whether the tag can be skipped if no matching value for incoming alerts. Default is false.
          examples:
          - true
        original_name:
          type: string
          description: The name of the column in the original map.
          examples:
          - null
      x-apidog-orders:
      - title
      - type
      - tag_name
      - override_existing
      - optional
      - original_name
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    enrichment_config_extraction:
      type: object
      description: Configuration for an extraction enrichment item.
      properties:
        source:
          type: string
          description: Field from which to extract the value.
        selected_source_system:
          type: string
          description: Restricts the extraction to a specific source system / integration key (for example `oim.genalertsapi`
            or `emailparser.ciena_mcs`). Omit to apply across all source systems.
        destination:
          type: string
          description: Destination tag for extracted value.
        regex:
          type: string
          description: Regex pattern for value extraction.
        template:
          type: string
          description: (System field) Extracted value template.
      required:
      - source
      - destination
      - regex
      x-apidog-orders:
      - source
      - selected_source_system
      - destination
      - regex
      - template
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
