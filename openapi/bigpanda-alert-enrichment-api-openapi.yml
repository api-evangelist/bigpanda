        source:
          type: string
          description: Optional filter for event source.
        destination:
          type: string
          description: Destination tag to populate.
        value:
          type: string
          description: Template value to apply to destination tag.
      required:
      - source
      - destination
      - value
      x-apidog-orders:
      - source
      - destination
      - value
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
