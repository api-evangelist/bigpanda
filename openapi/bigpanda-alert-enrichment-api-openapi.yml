                enrichments:
                  type: array
                  items:
                    $ref: '#/components/schemas/enrichment_item'
              x-apidog-orders:
              - enrichments
              x-apidog-ignore-properties: []
            examples:
              extraction:
                value:
                  enrichments:
                  - type: extraction
                    active: true
                    when:
                      AND:
                      - '=':
                        - status
                        - warning
                      - IN:
                        - source_system
                        - - oim.datadog_prod
                    config:
                      source: host
                      selected_source_system: oim.datadog_prod
                      destination: service_name
                      regex: ^([^-]+)-.*$
                    note: Extract service from host
                summary: Add an extraction rule
              composition:
                value:
                  enrichments:
                  - type: composition
                    active: true
                    when:
                      IN:
                      - source_system
                      - - type: regex
                          value: '*'
                    config:
                      source: All Systems
                      destination: service_name
                      value: fixedvalue
                    note: Set a fixed service value
                summary: Add a composition rule
      responses:
        '200':
          x-apidog-ordering: 0
          description: '200'
