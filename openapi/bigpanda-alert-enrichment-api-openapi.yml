        inbound fields across monitoring tools, with optional grouping of result columns.
      required:
      - type
      - name
      - config
      properties:
        type:
          type: string
          enum:
          - advanced_mapping
          description: Schema type. Use `advanced_mapping`.
        execution_order:
          type: string
          description: Run order of this schema relative to other enrichment schemas.
          examples:
          - '6'
        name:
          type: string
          description: Name of the mapping schema.
          examples:
          - map-schema 5
        active:
          type: boolean
          description: Whether the schema is active.
          default: true
