      x-apidog-ignore-properties: []
    advanced_mapping_group:
      type: object
      required:
      - fields
      - order
      - name
      - method
      description: A rule that clusters result columns together.
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/advanced_mapping_group_field'
          description: The columns to group together.
        order:
          type: integer
          description: Where in the run order this group runs. The first group with matched columns applies as the tag value.
          examples:
          - 1
        name:
          type: string
          description: The name of the group.
          examples:
          - alert_group_ticket_active
        method:
          type: string
          enum:
