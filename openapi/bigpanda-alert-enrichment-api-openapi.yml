          description: Column definitions for the map.
      x-apidog-orders:
      - fields
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    advanced_mapping_field:
      type: object
      required:
      - type
      - tag_name
      description: A column definition in an advanced mapping schema.
      properties:
        type:
          type: string
          enum:
          - query_tag
          - result_tag
          - group_tag
          description: 'Column type: `query_tag` (matched against the alert), `result_tag` (value applied to the alert), or
            `group_tag` (a column used within a group).'
        tag_name:
          type: string
          description: Column name. Must exactly match the column name in the uploaded map (and the BigPanda tag name).
          examples:
          - email
        groups:
          type: array
          description: (Optional, `result_tag` only) Rules that cluster result columns together. The first group with matched
            columns applies as the tag value.
          items:
            $ref: '#/components/schemas/advanced_mapping_group'
      x-apidog-orders:
      - type
      - tag_name
      - groups
