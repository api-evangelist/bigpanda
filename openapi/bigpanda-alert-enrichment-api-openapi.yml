        \ formatted and, if it was, provides a URL for checking the status of the upload.\n\nThe entire table upload must\
        \ complete successfully for the changes to take effect; the API does not support partial success.\n\nA typical asynchronous\
        \ upload negotiation consists of these steps:\n1. Upload the table: A Job object is created and a ​location​​ URL\
        \ for checking the status is returned.\n2. Use the URL to periodically check the job status until it is set to done\
        \ or failed.\n3. If the job was not successful, you can retry the request. If necessary, debug any connectivity issues\
        \ or data formatting issues that may have contributed to the failed upload. For example, ensure the CSV file follows\
        \ the enrichment schema definition.\n\n**Rate limit:** 5 requests per second."
      operationId: retrieve-job-status
      tags:
      - Alert Tags & Enrichment
      parameters:
      - name: job_id
        in: path
