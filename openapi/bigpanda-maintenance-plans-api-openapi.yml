  description: Schedule maintenance windows to suppress alerts
paths:
  /resources/v2.0/maintenance-plans:
    get:
      operationId: listMaintenancePlans
      summary: BigPanda List Maintenance Plans
      description: Returns all maintenance plans.
      tags:
      - Maintenance Plans
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of maintenance plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenancePlansResponse'
              examples:
                ListMaintenancePlans200Example:
                  summary: Default listMaintenancePlans 200 response
                  x-microcks-default: true
                  value:
                    maintenance_plans:
                    - id: mp-abc123
                      name: Weekend Maintenance
                      active: false
                      start: 1713000000
                      end: 1713086400
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createMaintenancePlan
      summary: BigPanda Create Maintenance Plan
      description: Creates a new maintenance plan to suppress alerts during a window.
      tags:
      - Maintenance Plans
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenancePlanRequest'
            examples:
              CreateMaintenancePlan201Example:
                summary: Default createMaintenancePlan request example
                x-microcks-default: true
                value:
                  name: Weekend Maintenance
                  condition: host = "production-database-1"
                  start: 1713000000
                  end: 1713086400
      responses:
        '201':
          description: Maintenance plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenancePlan'
              examples:
                CreateMaintenancePlan201Example:
                  summary: Default createMaintenancePlan 201 response
                  x-microcks-default: true
                  value:
                    id: mp-abc123
                    name: Weekend Maintenance
                    active: false
                    start: 1713000000
                    end: 1713086400
        '400':
          description: Invalid maintenance plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://api.bigpanda.io
      description: BigPanda API
  /resources/v2.0/maintenance-plans/{maintenance_id}:
    servers:
    - url: https://api.bigpanda.io
      description: US Region
    - url: https://api.eu.bigpanda.io
      description: EU Region
    delete:
      summary: Delete a Plan
      deprecated: false
      description: 'Deletes a specific maintenance plan and removes it from the system.


        > 🚧 **Authentication**

        >

        > All BigPanda APIs require Bearer Token Authorization in the call headers.

        >

        > This API uses the User API Key type of Authorization token. Your User API Key must be provided in the header, prefixed by the word `Bearer`.

        >

        > Example:

        > `Authorization: Bearer [YOUR_USER_API_KEY]`


        **Rate limit:** 5 requests per second.'
      operationId: maintenance-plan-v2-delete-plan
      tags:
      - Maintenance Plans
      parameters:
      - name: maintenance_id
        in: path
        description: System id for a maintenance plan in BigPanda.
        required: true
        example: ''
        schema:
          type: string
          examples:
          - 1231tyg2q34551
