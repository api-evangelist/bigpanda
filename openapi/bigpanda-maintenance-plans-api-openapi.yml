components:
  schemas:
    MaintenancePlan:
      title: Maintenance Plan
      description: A BigPanda maintenance plan for suppressing alerts.
      type: object
      properties:
        id:
          type: string
          description: Maintenance plan ID.
          example: mp-abc123
        name:
          type: string
          description: Maintenance plan name.
          example: Weekend Maintenance
        active:
          type: boolean
          description: Whether the maintenance plan is currently active.
          example: false
        start:
          type: integer
          description: Start Unix timestamp.
          example: 1713000000
        end:
          type: integer
          description: End Unix timestamp.
          example: 1713086400
    MaintenancePlanRequest:
      title: Maintenance Plan Request
      description: Payload for creating a maintenance plan.
      type: object
      required:
      - name
      - condition
      - start
      - end
      properties:
        name:
          type: string
          description: Maintenance plan name.
          example: Weekend Maintenance
        condition:
          type: string
          description: Filter condition for hosts in maintenance.
          example: host = "production-database-1"
        start:
          type: integer
          description: Start Unix timestamp.
          example: 1713000000
        end:
          type: integer
          description: End Unix timestamp.
          example: 1713086400
    MaintenancePlansResponse:
      title: Maintenance Plans Response
      description: List of maintenance plans.
      type: object
      properties:
        maintenance_plans:
          type: array
          description: Array of maintenance plans.
          items:
            $ref: '#/components/schemas/MaintenancePlan'
    ErrorResponse:
      title: Error Response
      description: Standard error response.
      type: object
      properties:
        error:
          type: string
          description: Error message.
          example: resource not found
        status:
          type: integer
          description: HTTP status code.
          example: 404
    updated_by:
      type: string
      description: System id of the user or tool that last updated the resource.
      x-apidog-folder: ''
      examples:
      - 63bd56897755560012bf3555
    maintenance_plan_response:
      type: object
      properties:
        id:
          type: string
          description: System-generated unique identifier for a maintenance plan.
          examples:
          - 64f0b24f340000bbd269595c
        status:
          type: string
          description: The maintenance plan's status.
          examples:
          - planned
        maintenance_key:
          type: string
          description: Third party (Jira, ServiceNow, etc.) system key for integrated maintenance management. If no integration key is included in the call, a system ID will be added automatically.
          examples:
          - MNT-de9d22d700e9
        name:
          type: string
          description: User-defined name for the plan.
          examples:
          - host1 maintenance
        start:
          type: integer
          description: Unix epoch time when the scheduled plan starts (in seconds). For recurring plans, this time should be the start of the first maintenance window.
          examples:
          - 1733904622
        end:
          type: integer
          description: Unix epoch time when the scheduled plan ends (in seconds). For recurring plans, this time should be the date when the plan should stop repeating.
          examples:
          - 1734768622
        description:
          type: string
          description: Brief user-defined summary of the maintenance plan.
          examples:
          - this is a description
        custom_tags:
          type: array
          description: Metadata about the plan in an array of key:value pairs.
          items:
            $ref: '#/components/schemas/maintenance_custom_tags'
        created_by:
          $ref: '#/components/schemas/created_by'
        created_at:
          $ref: '#/components/schemas/created_at'
        updated_by:
          $ref: '#/components/schemas/updated_by'
        updated_at:
          $ref: '#/components/schemas/updated_at'
        frequency:
          type: string
          description: How often the scheduled plan should silence alerts. One of [`Once`, `Daily`, `Weekly`, `Monthly`]. Default is `Once`. This field is case-insensitive.
          examples:
          - Daily
        frequency_data:
          $ref: '#/components/schemas/updated_at'
      x-apidog-orders:
      - id
      - status
      - maintenance_key
      - name
      - start
      - end
      - description
      - custom_tags
      - created_by
      - created_at
      - updated_by
      - updated_at
      - frequency
      - frequency_data
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    generic204response:
      type: object
      description: 'Call was successful.

        '
      properties:
        status:
          type: integer
          examples:
          - 204
        data:
          type: object
          properties: {}
          x-apidog-orders: []
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - status
      - data
      x-apidog-folder: ''
      examples:
      - status: 204
        data: {}
      x-apidog-ignore-properties: []
    maintenance_plan_object:
      required:
      - name
      - condition
      - start
      - end
      type: object
      properties:
        name:
          type: string
          description: User-defined name for the plan.
          examples:
          - host1 maintenance
        condition:
          type: object
          additionalProperties: true
          description: 'Maintenance condition in the form of a [BPQL object format](https://api-docs.bigpanda.io/en#description/bpql-object-syntax). Cannot be longer than 80,000 characters long.

            '
          x-apidog-orders: []
          properties: {}
          x-apidog-ignore-properties: []
        start:
          type: integer
          description: 'Unix epoch time when the scheduled plan starts (in seconds). For recurring plans, this time should be the start of the first maintenance window.

            '
          format: int32
        end:
          type: integer
          description: 'Unix epoch time when the scheduled plan ends (in seconds). For recurring plans, this time should be the date when the plan should stop repeating.

            '
          format: int32
        description:
          type: string
          description: Brief user-defined summary of the maintenance plan.
        frequency:
          type: string
          description: 'How often the scheduled plan should silence alerts. One of: `Once`, `Daily`, `Weekly`, `Monthly`. This field is case-sensitive.

            '
          default: Once
        frequency_data:
          type: object
          properties:
            relativity:
              type: string
              description: e.g. First, Second, Last.
            duration:
              type: integer
              description: Duration in seconds.
          description: Recurrence detail for recurring plans.
          x-apidog-orders:
          - relativity
          - duration
          x-apidog-ignore-properties: []
        post_maintenance_action:
          type: string
          description: 'What should happen to alerts suppressed by this plan after the maintenance window ends.  One of: [Resolve, Reactivate, None]

            '
          default: None
        time_zone:
          type: string
          description: 'The maintenance plan''s time zone setting. Default is UTC. See the [full list of supported time zones here](https://docs.bigpanda.io/reference/supported-time-zones).

            '
        custom_tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
            x-apidog-orders:
            - name
            - value
            x-apidog-ignore-properties: []
      x-apidog-orders:
