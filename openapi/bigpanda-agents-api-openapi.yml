      x-apidog-orders:
      - jsonRpc
      - id
      - method
      - params
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    mcp200response:
      type: object
      properties:
        jsonRPC:
          type: string
          description: JSON RPC version.
          examples:
          - 2
        id:
          type: string
          description: Identifier established by the client.
          examples:
          - 1
        result:
          type: object
          properties:
            protocolVersion:
              type: string
              description: MCP protocol version.
              examples:
              - '2025-11-25T00:00:00.000Z'
            capabilities:
              type: array
              description: Client capabilities.
              examples:
              - tools
              items:
                type: string
            serverInfo:
              type: array
              description: Information about the connected server.
              examples:
              - name
              items:
                type: string
          x-apidog-orders:
          - protocolVersion
          - capabilities
          - serverInfo
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - jsonRPC
      - id
      - result
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    mcp405response:
      type: object
      description: 'Method not allowed (GET/DELETE on stateless endpoint)

