      properties:
        status:
          type: integer
          examples:
          - 405
        errors:
          type: array
          items:
            type: string
            examples:
            - 'Method not allowed (GET/DELETE on stateless endpoint)    '
      x-apidog-orders:
      - status
      - errors
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    a2a-tasksget-config:
      type: object
      title: tasks/get (polling)
      properties:
        json-rpc:
          type: string
          description: JSON RPC version. Must be 2.0.
          examples:
          - 2
        id:
          type: string
          description: Identifier established by the client.
          examples:
          - 1
        method:
          type: string
          description: The operation that will take place over this endpoint. One of `message/send`, `message/stream`, or
            `task/get`.
          examples:
          - tasks/get
        params:
          type: object
          items:
            type: object
            properties: {}
          properties: {}
          x-apidog-orders: []
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - json-rpc
      - id
      - method
      - params
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
    a2a200response:
      type: object
      description: 'Call was successful.

        '
      properties:
        status:
          type: integer
          examples:
          - 200
        data:
          type: object
          properties:
            jsonRPC:
              type: string
              description: JSON RPC version.
              examples:
              - 2
            id:
              type: string
              description: Identifier established by the client.
              examples:
              - 1
            result:
              type: object
              properties:
                taskId:
                  type: string
                  description: Unique identifier of the task.
                  examples:
                  - 6830f1a2e3b4c5d6e7f80001
                status:
                  type: string
                  description: Status of the task. One of `running`, `completed`, `failed`, or `not_found`.
                artifacts:
                  type: object
                  properties:
                    parts:
                      type: array
                      description: Parts of the message.
                      examples:
                      - text
                      items:
                        type: string
                  x-apidog-orders:
                  - parts
                  x-apidog-ignore-properties: []
              x-apidog-orders:
              - taskId
              - status
              - artifacts
              x-apidog-ignore-properties: []
          x-apidog-orders:
          - jsonRPC
          - id
          - result
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - status
      - data
      x-apidog-folder: ''
      x-apidog-ignore-properties: []
x-server-notes:
- US host https://api.bigpanda.io verified live 2026-09-04 (HTTP 401 Authorization Required on an unauthenticated request).
- EU host https://api.eu.bigpanda.io is the value BigPanda publishes at https://api-docs.bigpanda.io/regions. It did NOT resolve
  in DNS on 2026-09-04. The live EU host observed on that date is https://eu-api.bigpanda.io (401 Authorization Required).
  The per-endpoint fragments on the same site declare a third EU value, https://eu-api.biggy.io, which also does not resolve.
  Recorded as published; not corrected.
