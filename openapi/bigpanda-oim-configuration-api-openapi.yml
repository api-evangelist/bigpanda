info:
  title: BigPanda OIM Configuration API
  description: BigPanda OIM Configuration operations, assembled verbatim from the OpenAPI fragments BigPanda publishes on its own API reference at https://api-docs.bigpanda.io/. Each operation carries x-source-url naming the exact provider page it was read from. BigPanda hosts each organization in a single data management region (US or EU); send requests to the base URL for your region.
  version: 1.0.0
  contact:
    name: BigPanda Support
    url: https://api-docs.bigpanda.io/
  license:
    name: Proprietary
    url: https://www.bigpanda.io/legal/
  x-provenance:
    method: searched
    source: https://api-docs.bigpanda.io/llms.txt
    harvested: '2026-09-04'
    assembly: 'Operations copied verbatim from the per-endpoint OpenAPI 3.0.1 fragments BigPanda publishes at https://api-docs.bigpanda.io/<endpoint>.md. Assembly-only normalizations: Apidog x-apidog security metadata stripped, securityScheme type "bearer" corrected to type http/scheme bearer, schema name collisions suffixed. No operation, parameter, schema or response was authored by API Evangelist.'
    operations: 7
servers:
- url: https://api.bigpanda.io
  description: US Region
- url: https://api.eu.bigpanda.io
  description: EU Region
tags:
- name: OIM Configuration
paths:
  /configurations/alerts/oim/{app_key_p}:
    post:
      summary: Create/Update OIM Configuration
      deprecated: false
      description: '## Authentication


        All BigPanda APIs require Bearer Token Authorization in the call headers.


        This API uses the Organization token type of Authorization token. Your org token must be provided in the header, prefixed by the word `Bearer`.


        Example:

        `Authorization: Bearer [YOUR_ORG_TOKEN]`


        > 🚧 **Incorrect URL in Builder**

        >

        > This endpoint is accessed at the https://integrations.bigpanda.io url, not https://api.bigpanda.io


        ## New default

        As of October 2024, new OIM integrations will not flatten arrays by default. Existing integrations will not be affected by this change. If you would like to turn off array flattening for an integration created before October 2024, please reach out to support to update the array flattening setting.


        ## Sample payload object

        For field validation, BigPanda checks against an existing sample JSON payload from the integration. For all create and update calls to the API, a sample must be included in the body of all calls.


        All payload fields referenced in configuration settings must be included in the sample.


        To generate a sample payload:

        - Send a test or sample event to BigPanda after integration installation, but before configuration.

        - Generate an event preview in your tool.

        - Manually enter payload field values into the interactive code generator on the BigPanda docs site.


        When included in the API body, the sample payload should be JSON formatted with double quotes. The payload can include nested objects.


        ```JSON sample payload

        "sample_payload": {

        "alerts": [

        {

        "generatorURL": "https://some-url.io",

        "fingerprint": "123456789",

        "annotations": {

        "description": "This alert is used to check the CPU utilization of this non-existent server",

        "runbook_url": "https://runbook.io/cpu-check"

        },

        "startsAt": "2022-07-05T19:59:25.661Z",

        "endsAt": "0001-01-01T00:00:00Z",

        "status": "firing",

        "labels": {

        "severity": "page",

        "instance": "bigpanda-server",

        "alertname": "BigPanda Test",

        "team": "metrics",

        "env": "test",

        "job": "CPU Check",

        "locale": "ca",

        "timestamp": "1.657051103137505e+09"

        }

        }

        ],

        "commonLabels": {

        "instance": "bigpanda-server",

        "alertname": "BigPanda Test",

        "team": "metrics",

        "env": "test",

        "job": "CPU Check",

        "locale": "ca",

        "timestamp": "1.657051103137505e+09"

        },

        "externalURL": "https://external-url.io",

        "groupLabels": {

        "instance": "bigpanda-server",

        "alertname": "BigPanda Test",

        "team": "metrics",

        "env": "test",

        "job": "CPU Check",

        "locale": "ca",

        "timestamp": "1.657051103137505e+09"

        },

        "receiver": "bigpanda",

        "version": "4",

        "commonAnnotations": {

        "description": "This alert is used to check the CPU utilization of this non-existent server",

        "runbook_url": "https://runbook.io/cpu-check"

        },

        "status": "firing"

        }

        ```


        **Rate limit:** 5 requests per second.'
      operationId: create-update-oim-configuration-v2
      tags:
      - OIM Configuration
      parameters:
      - name: app_key_p
        in: path
        description: The app key for the associated integration.
        required: true
        example: ''
        schema:
          type: string
          examples:
          - gag342351qgb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/oim_v2_config'
      responses:
        '200':
          x-apidog-ordering: 0
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oim_v2_config'
          headers: {}
          x-apidog-name: ''
      security:
      - BearerOrg22: []
      x-publication-status: live
      x-run-in-apidog: https://app.apidog.com/web/project/1203004/apis/api-37770209-run
      x-source-url: https://api-docs.bigpanda.io/create-update-oim-configuration.md
      x-source-page: Create/Update OIM Configuration
    get:
      summary: Retrieve OIM Configuration
      deprecated: false
      description: '## Authentication


        All BigPanda APIs require Bearer Token Authorization in the call headers.


        This API uses the Organization token type of Authorization token. Your org token must be provided in the header, prefixed by the word `Bearer`.


        Example:

        `Authorization: Bearer [YOUR_ORG_TOKEN]`


        > 🚧 **Incorrect URL in Builder**

        >

        > This endpoint is accessed at the https://integrations.bigpanda.io url, not https://api.bigpanda.io


        **Rate limit:** 5 requests per second.'
      operationId: retrieve-oim-configuration-v2
      tags:
      - OIM Configuration
      parameters:
      - name: app_key_p
        in: path
        description: The app key for the associated integration.
        required: true
        example: ''
        schema:
          type: string
          examples:
          - gag342351qgb
      responses:
        '200':
          x-apidog-ordering: 0
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oim_v2_config3'
          headers: {}
          x-apidog-name: ''
      security:
      - BearerOrg22: []
      x-publication-status: live
      x-run-in-apidog: https://app.apidog.com/web/project/1203004/apis/api-37770208-run
      x-source-url: https://api-docs.bigpanda.io/retrieve-oim-configuration.md
      x-source-page: Retrieve OIM Configuration
  /configurations/alerts/oim/{app_key}/preprocessor:
    post:
      summary: Update Config with Preprocessor Function
      deprecated: false
      description: 'Update an OIM integration configuration with preprocessor functions (for example, URL shortening). Preprocessing functions run on incoming payloads before parsing rules are applied.

        Replace `{app_key}` in the path with the `appKey` of the target integration.


        **Rate limit:** 5 requests per second.'
      operationId: postConfigurationsAlertsOimByAppKeyPreprocessor
      tags:
      - OIM Configuration
      parameters:
      - name: app_key
        in: path
        description: The integration app key that identifies the target OIM integration.
        required: true
        example: ''
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{ORG_BEARER_TOKEN}}
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  properties:
                    preprocessing:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          order:
                            type: integer
                          tags:
                            type: array
                            items:
                              type: string
                          params:
                            type: object
                            properties:
                              delimiter:
                                type: string
                            required:
                            - delimiter
                            x-apidog-orders:
                            - delimiter
                        x-apidog-orders:
                        - id
                        - order
                        - tags
                        - params
                    map_remaining:
                      type: boolean
                    is_array:
                      type: boolean
                    secondary_property:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                        x-apidog-orders:
                        - name
                    map_remaining_flatten_arrays:
                      type: boolean
                    primary_property:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                        x-apidog-orders:
                        - name
                    version:
                      type: string
                    force_lowercase:
                      type: boolean
                    additional_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          source:
                            type: array
                            items:
                              type: string
                        required:
                        - name
                        - source
                        x-apidog-orders:
                        - name
                        - source
                    status:
                      type: object
                      properties:
                        default_to:
                          type: string
                        status_map:
                          type: object
                          properties:
                            warning:
                              type: array
                              items:
                                type: string
                            acknowledged:
                              type: array
                              items:
                                type: string
                            critical:
                              type: array
                              items:
                                type: string
                            ok:
                              type: array
                              items:
                                type: string
                            unknown:
                              type: array
                              items:
                                type: string
                          required:
                          - warning
                          - acknowledged
                          - critical
                          - ok
                          - unknown
                          x-apidog-orders:
                          - warning
                          - acknowledged
                          - critical
                          - ok
                          - unknown
                        source:
                          type: array
                          items:
                            type: string
                      required:
                      - default_to
                      - status_map
                      - source
                      x-apidog-orders:
                      - default_to
                      - status_map
                      - source
                    timestamp:
                      type: object
                      properties:
                        source:
                          type: array
                          items:
                            type: string
                      required:
                      - source
                      x-apidog-orders:
                      - source
                  required:
                  - preprocessing
                  - map_remaining
                  - is_array
                  - secondary_property
                  - map_remaining_flatten_arrays
                  - primary_property
                  - version
                  - force_lowercase
                  - additional_attributes
                  - status
                  - timestamp
                  x-apidog-orders:
                  - preprocessing
                  - map_remaining
                  - is_array
                  - secondary_property
                  - map_remaining_flatten_arrays
                  - primary_property
                  - version
                  - force_lowercase
                  - additional_attributes
                  - status
                  - timestamp
                sample_payload:
                  type: string
              required:
              - config
              - sample_payload
              x-apidog-orders:
              - config
              - sample_payload
      responses:
        '200':
          x-apidog-ordering: 0
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apidog-orders: []
          headers: {}
          x-apidog-name: ''
        '400':
          x-apidog-ordering: 1
          description: ''
          headers: {}
          x-apidog-name: ''
        '401':
          x-apidog-ordering: 2
          description: ''
          headers: {}
          x-apidog-name: ''
        '429':
          x-apidog-ordering: 3
          description: ''
          headers: {}
          x-apidog-name: ''
        '500':
          x-apidog-ordering: 4
          description: ''
          headers: {}
          x-apidog-name: ''
      x-publication-status: live
      x-run-in-apidog: https://app.apidog.com/web/project/1203004/apis/api-37770210-run
      x-source-url: https://api-docs.bigpanda.io/update-config-with-preprocessor-function.md
      x-source-page: Update Config with Preprocessor Function
components:
  schemas:
    additional_attributes:
      type: object
      properties:
        isDestinationAccepted:
          type: boolean
          examples:
          - true
          description: (Optional) Whether the destination tag was accepted.
        isSourceAccepted:
          type: boolean
          examples:
          - true
          description: (Optional) Whether the source tag was accepted.
        isSuggestion:
          type: boolean
          examples:
          - true
          description: (Optional) Whether the tag was suggested by BigPanda Tag Normalization.
        name:
          type: string
          examples:
          - check
          description: (Optional) Set a name for the tag in BigPanda.
        source:
          type: array
          items:
            type: string
          examples:
          - - '@alert.labels.alertname'
            - '@alert.labels.check'
          description: Array of payload fields to match.
        suggestedDestination:
          type: string
          examples:
          - check
          description: Suggested Destination tag name.
        suggestedSources:
          type: array
          items:
            type: string
          examples:
          - - '@alert.labels.alertname'
            - '@alert.labels.check'
          description: Array of payload fields to match for suggested tags.
        flatten:
          type: boolean
          examples:
          - false
          description: (Optional) Whether or not to flatten a nested object for improved mapping.
      x-apidog-orders:
      - isDestinationAccepted
      - isSourceAccepted
      - isSuggestion
      - name
      - source
