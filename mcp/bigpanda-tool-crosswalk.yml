coverage:
  rest_operations: 263
  mcp_tools_published: 0
  mcp_tools_bound: 0
  rest_operations_with_a_tool: 3
  rest_only: 260
  mcp_only: 0
  note: >-
    A coverage number of 3/263 is not a criticism of the MCP server's quality — it reflects that BigPanda
    built a CONFIGURABLE agent surface rather than a mirror of the REST API. It does mean an agent cannot
    know in advance what BigPanda can do for it; discovery requires a key and a tenant.
